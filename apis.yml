aid: julienne-bruno
name: Julienne Bruno
description: >-
  JULIENNE BRUNO is a London-based food company that creates, develops and produces
  naturally plant-based fresh cheeses. Its Collection 01 comprises Burrella, Superstraccia
  and Crematta - dairy-free, fermented products positioned as original foods in their own
  category rather than vegan imitations. Products are sold direct-to-consumer through a
  Shopify storefront and stocked at Ocado, Whole Foods, Planet Organic, Harrods and
  Selfridges, and featured on the menus of 800+ restaurants, pubs and cafes. Founded in
  2020 and backed by Seedcamp, the brand and assets were later acquired by Harvey &
  Brockless (The Compleat Food Group). This is a consumer packaged goods company; it
  publishes no developer API - the profile is enriched from its public web surface.
